<section id="dress-code" class="mx-auto max-w-6xl bg-transparent px-4 py-10 sm:px-6 lg:px-8">
  <div class="bg-transparent p-5 text-center sm:p-8">
    <img
          src="assets/branding/dresscode-2.webp"
          alt="Referencia de traje formal para ellos"
          class="mx-auto mt-4 h-52 w-full object-contain sm:h-72"
          loading="lazy"
          decoding="async"
    /> 
    <h2 class="mt-2 text-3xl font-light text-[#957845] sm:text-5xl tracking-wider">{{ title() }}</h2>
    <h2 class="mt-2 text-2xl font-light text-[#957845] sm:text-4xl tracking-wider">Código de vestimenta</h2>
    <p class="mt-3 text-[#957845]">{{ subtitle() }}</p>
