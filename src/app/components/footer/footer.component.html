<footer id="despedida" class="relative overflow-hidden bg-[#e9dfeb]">
  <div class="relative mx-auto max-w-4xl px-6 py-20 text-center sm:px-8 lg:py-24">
    <p class="text-xs tracking-[0.32em] text-[#65516f] uppercase sm:text-sm" [innerHTML]="title()"></p>

    <h2 class="mx-auto mt-6 max-w-2xl text-2xl leading-relaxed text-[#6f5735] sm:text-3xl">
      <span [innerHTML]="subtitle1()"></span>
    </h2>

    <div class="mx-auto mt-8 h-px w-32 bg-[#947fa0]/50"></div>

    <p class="mt-8 text-base text-[#7c6541] sm:text-lg"><span [innerHTML]="subtitle2()"></span></p>
    <p class="mt-2 text-2xl font-medium tracking-wide text-[#957845] sm:text-3xl"><span [innerHTML]="subtitle3()"></span></p>

    <a
      href="#inicio"
      class="mt-10 inline-flex items-center justify-center border border-[#65516f]/50 bg-white/60 px-6 py-2.5 text-sm font-medium tracking-wide text-[#65516f] transition-colors duration-200 hover:bg-white"
    >
      Volver al inicio
    </a>
    <p class="mt-8 text-xs tracking-[0.2em] text-[#65516f] uppercase sm:text-sm"><span [innerHTML]="subtitle4()"></span></p>
  </div>
</footer>
