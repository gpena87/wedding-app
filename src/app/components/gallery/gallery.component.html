<section id="galeria" class="relative overflow-hidden">
<div class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_top,rgba(196,168,159,0.08),transparent_55%)]"></div>
<div class="mx-auto flex w-full max-w-6xl flex-col items-center justify-center gap-10 px-4 py-16 text-center sm:px-6 lg:px-8 lg:py-24">
  <div class="relative mx-auto aspect-square w-full max-w-[36rem] overflow-hidden rounded-none shadow-[0_12px_26px_rgba(91,74,60,0.12)]">
    <div class="pointer-events-none absolute inset-0 rounded-t-[380px] rounded-b-[0px] bg-[radial-gradient(circle_at_center,transparent_60%,rgba(0,0,0,0.12)_100%)]"></div>
    @if (isImageLoading) {
      <div
        class="absolute inset-0 z-10 flex items-center justify-center bg-white/80"
        aria-label="Cargando imagen"
      >
        <div class="h-10 w-10 animate-spin rounded-full border-4 border-[#8a78aa]/30 border-t-[#8a78aa]" aria-hidden="true"></div>
      </div>
    }
    <img
      src="assets/branding/gallery.jpg"
      alt="Iniciales de los novios"
      loading="lazy"
      decoding="async"
      (load)="isImageLoading = false"
      class="mx-auto aspect-square h-full w-full object-cover"
    />
  </div>
</div>
</section>
