<section id="itinerario" class="mx-auto max-w-6xl bg-transparent px-4 py-10 sm:px-6 lg:px-8">
  <div class="bg-transparent p-5 text-center sm:p-8">
    <h2 class="mt-2 text-3xl font-light text-[#957845] sm:text-5xl tracking-wider">{{ title() }}</h2>
    <p class="mt-3 text-[#957845]">{{ subtitle() }}</p>
    <ol class="mx-auto mt-10 max-w-2xl border-l border-[#957845]/60 text-left">
      @for (event of events(); track event.title) {
        <li appRevealOnScroll class="relative flex items-center gap-4 pb-8 pl-6 last:pb-0 sm:gap-6 sm:pl-8">
          <span class="absolute -left-[9px] top-1 h-4 w-4 rounded-full border-2 border-[#957845] bg-[#fdfbf7]" aria-hidden="true"></span>
          <img
            [src]="'assets/branding/itinerary/' + event.image"
            [alt]="event.title"
            class="h-24 w-28 shrink-0 object-contain sm:h-32 sm:w-36"
            loading="lazy"
            decoding="async"
          />
          <div>
            <h3 class="text-xl font-semibold text-[#957845] sm:text-2xl">{{ event.title }}</h3>
            <p class="mt-1 text-lg text-[#5a5047]">{{ event.time }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</section>
