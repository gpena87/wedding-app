<section id="itinerario" class="mx-auto max-w-6xl bg-transparent px-4 py-10 sm:px-6 lg:px-8">
  <div class="bg-transparent p-5 text-center sm:p-8">
    <p class="text-base font-semibold uppercase tracking-widest text-[#957845]">Agenda del dia</p>
    <h2 class="mt-2 text-3xl font-light text-[#957845] sm:text-5xl tracking-wider">{{ title() }}</h2>
    <p class="mt-3 text-[#957845]">{{ subtitle() }}</p>
    <div class="mt-8 flex justify-center">
      <article class="w-full max-w-5xl p-5 text-center">
        <img
          src="assets/branding/programacion.png"
          alt="Imagen de ceremonia"
          class="mx-auto block h-auto max-h-[28rem] w-full object-contain sm:max-h-[36rem] lg:max-h-[44rem]"
          loading="lazy"
          decoding="async"
        />
      </article>
    </div>
  </div>
</section>
