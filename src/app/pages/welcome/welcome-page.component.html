<main class="fixed inset-0 h-dvh min-h-0! w-full overflow-hidden text-center">
  <div class="relative h-full w-full">
  <div class="contents">
  <svg
    class="pointer-events-none absolute inset-0 h-full w-full "
    viewBox="0 0 100 100"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="welcome-paper" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f7f4fb" />
        <stop offset="1" stop-color="#e9e2f1" />
      </linearGradient>
      <linearGradient id="welcome-flap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ece6f3" />
        <stop offset="1" stop-color="#d9cfe6" />
      </linearGradient>
      <filter id="welcome-flap-shadow" x="-5%" y="-5%" width="110%" height="125%">
        <feDropShadow dx="0" dy="0.9" stdDeviation="1.2" flood-color="#65516f" flood-opacity="0.22" />
      </filter>
    </defs>
    <rect width="100" height="100" fill="url(#welcome-paper)" />
    <g class="hidden sm:inline">
      <path d="M0 0H100L50 50Z" fill="url(#welcome-flap)" filter="url(#welcome-flap-shadow)" />
      <path d="M0 0 50 50 100 0" stroke="#b9a9cd" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none" stroke-linejoin="round" />
    </g>
    <g class="sm:hidden">
      <rect width="100" height="100" fill="#ece6f3" />
      <path d="M0 0H100V26L50 50L0 26Z" fill="url(#welcome-flap)" filter="url(#welcome-flap-shadow)" />
      <path d="M0 26 50 50 100 26" stroke="#b9a9cd" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none" stroke-linejoin="round" />
    </g>
  </svg>
  <button
    type="button"
    (click)="enter()"
    [disabled]="isOpening()"
    aria-label="Abrir invitación"
    class="font-script absolute left-1/2 top-[50%] z-10 flex h-[clamp(8rem,36vw,11rem)] w-[clamp(8rem,36vw,11rem)] -translate-x-1/2 -translate-y-1/2 cursor-pointer flex-col items-center justify-center rounded-full border-[3px] border-[#f3eff8] bg-[radial-gradient(circle_at_35%_28%,#8a78aa,#65516f_78%)] text-white shadow-[0_8px_24px_rgba(101,81,111,0.35)] ring-1 ring-[#65516f]/40 transition-transform duration-300 hover:scale-105 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#8a78aa]"
  >
    @if (isOpening()) {
      <span class="pointer-events-none absolute -inset-2 animate-spin rounded-full border-[3px] border-[#8a78aa]/30 border-t-[#65516f]" aria-hidden="true"></span>
      <span class="pointer-events-none absolute inset-0 animate-ping rounded-full bg-[#8a78aa]/30" aria-hidden="true"></span>
    }
    <span class="relative flex items-center gap-1 text-[clamp(1.7rem,9vw,2.8rem)] font-medium leading-none">
      MJ<span class="text-[0.55em]">&amp;</span>G
    </span>
    <span class="relative mt-1 font-sans text-[clamp(0.55rem,2.4vw,0.75rem)] font-normal uppercase tracking-[0.25em]">{{ isOpening() ? 'Abriendo' : 'Abrir' }}</span>
  </button>
  </div>
  </div>
</main>
