<main class="relative flex h-svh min-h-0! w-full items-center justify-center overflow-hidden bg-transparent px-4 text-center">
  <div class="relative mx-auto flex max-h-full w-full max-w-xl flex-col items-center justify-center gap-[1.2svh]">
    <img
      src="assets/branding/noscasamos.svg"
      alt="Iniciales de los novios"
      decoding="async"
      class="mx-auto h-[24svh] w-auto max-w-full object-contain opacity-75 grayscale"
    />
    <p class="text-[clamp(0.6rem,1.6svh,0.75rem)] uppercase tracking-[0.45em] text-[#76658f]">Bienvenidos</p>
    <h2 class="text-[clamp(1rem,3svh,1.5rem)] font-light uppercase tracking-[0.2em] text-[#665579] sm:tracking-[0.35em]">
      María José
    </h2>
    <span
      class="font-script flex h-[clamp(2rem,6svh,3.5rem)] w-[clamp(2rem,6svh,3.5rem)] items-center justify-center rounded-full bg-[#c9bde0] text-[clamp(1.2rem,3.5svh,1.875rem)] leading-none text-white shadow-sm"
      aria-hidden="true"
    >&amp;</span>
    <h2 class="text-[clamp(1rem,3svh,1.5rem)] font-light uppercase tracking-[0.2em] text-[#665579] sm:tracking-[0.35em]">
      Gonzalo Andrés
    </h2>
    <p class="max-w-md text-[clamp(0.75rem,1.9svh,1rem)] leading-relaxed tracking-wide text-[#76658f]">
      Con mucha alegría te invitamos a compartir con nosotros el día más especial de nuestras vidas.
    </p>
    <button
      type="button"
      (click)="enter()"
      class="mt-[1.5svh] rounded-full bg-[#65516f] px-8 py-[1.6svh] text-xs font-medium uppercase tracking-[0.3em] text-white shadow-sm transition-colors duration-200 hover:bg-[#947fa0] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8a78aa]"
    >
      Ingresar
    </button>
  </div>
</main>
