<main class="relative flex min-h-svh w-full items-center justify-center bg-transparent px-4 py-12 text-center">
  <div class="relative mx-auto flex w-full max-w-xl flex-col items-center gap-3">
    <img
      src="assets/branding/noscasamos.svg"
      alt="Iniciales de los novios"
      decoding="async"
      class="mx-auto h-auto w-full max-w-[13rem] object-contain opacity-75 grayscale sm:max-w-xs"
    />
    <p class="mt-2 text-xs uppercase tracking-[0.45em] text-[#76658f]">Bienvenidos</p>
    <h2 class="mt-2 text-xl font-light uppercase tracking-[0.2em] text-[#665579] sm:text-2xl sm:tracking-[0.35em]">
      María José
    </h2>
    <span
      class="font-script flex h-12 w-12 items-center justify-center rounded-full bg-[#c9bde0] text-2xl leading-none text-white shadow-sm sm:h-14 sm:w-14 sm:text-3xl"
      aria-hidden="true"
    >&amp;</span>
    <h2 class="text-xl font-light uppercase tracking-[0.2em] text-[#665579] sm:text-2xl sm:tracking-[0.35em]">
      Gonzalo Andrés
    </h2>
    <p class="mt-3 max-w-md text-sm leading-relaxed tracking-wide text-[#76658f] sm:text-base">
      Con mucha alegría te invitamos a compartir con nosotros el día más especial de nuestras vidas.
    </p>
    <button
      type="button"
      (click)="enter()"
      class="mt-6 rounded-full bg-[#65516f] px-8 py-3 text-xs font-medium uppercase tracking-[0.3em] text-white shadow-sm transition-colors duration-200 hover:bg-[#947fa0] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#8a78aa]"
    >
      Ingresar
    </button>
  </div>
</main>
