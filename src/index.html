<!doctype html>
<html lang="en" data-theme="light" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <title>Invitación Boda</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    html {
      height: 100%;
    }
    body {
      position: relative;
      min-height: 100vh;
      background-color: #efe7de;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url('/assets/branding/Designer2.webp');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
    }
    @media (min-width: 1024px) {
      body::before {
        background-image: url('/assets/branding/Designer1.webp');
      }
    }
    body > app-root {
      position: relative;
      z-index: 1;
      display: block;
    }
  </style>
</head>
<body class="min-h-screen w-full font-[Nunito_Sans,Segoe_UI,Tahoma,Geneva,Verdana,sans-serif] text-[#5a5047]">
  <div id="app-start-loader" class="fixed inset-0 z-[9999] flex min-h-screen w-full items-center justify-center bg-[#f8f6fb] bg-[url('/assets/branding/lilac-garden-tematica.webp')] bg-cover bg-center transition-opacity duration-300 ease-out" aria-label="Cargando">
    <div class="h-14 w-14 animate-spin rounded-full border-4 border-[#8a78aa]/30 border-t-[#8a78aa]" aria-hidden="true"></div>
  </div>
  <app-root></app-root>
</body>
</html>
